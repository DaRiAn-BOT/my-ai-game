<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Замковые Хроники</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=MedievalSharp&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="game-container" class="game-container">
        <div class="game-layout">
            <section class="panel-card left-column">
                <div class="panel-title">Профиль героя</div>

                <div class="hero-header">
                    <div id="hero-avatar" class="hero-avatar">🧙</div>
                    <label class="hero-name-field">
                        <span>Имя</span>
                        <input id="hero-name" type="text" value="Ариэль" maxlength="18">
                    </label>
                </div>

                <div class="stats-grid">
                    <label class="stat-row">
                        <span>💪 Сила</span>
                        <input id="hero-strength" type="number" min="1" max="20" value="12">
                    </label>
                    <label class="stat-row">
                        <span>🧠 Мудрость</span>
                        <input id="hero-wisdom" type="number" min="1" max="20" value="14">
                    </label>
                    <label class="stat-row">
                        <span>👑 Харизма</span>
                        <input id="hero-charisma" type="number" min="1" max="20" value="10">
                    </label>
                </div>

                <div class="panel-title inventory-title">Инвентарь</div>
                <div class="inventory-grid">
                    <div class="inventory-slot"><span>Слот 1</span><strong id="slot-0">Меч</strong></div>
                    <div class="inventory-slot"><span>Слот 2</span><strong id="slot-1">Зелье</strong></div>
                    <div class="inventory-slot"><span>Слот 3</span><strong id="slot-2">Печать</strong></div>
                </div>
            </section>

            <section class="panel-card center-column">
                <div class="panel-title">Карта регионов</div>
                <div class="region-grid">
                    <div class="region-pill"><span>🏰</span><strong>Замок</strong></div>
                    <div class="region-pill"><span>🌲</span><strong>Лес</strong></div>
                    <div class="region-pill"><span>⛏️</span><strong>Шахты</strong></div>
                </div>

                <div class="quest-card">
                    <p id="quest-text" class="quest-text">Вы вступаете в путь.</p>
                    <div id="choices-container" class="choices-container"></div>
                </div>
            </section>

            <aside class="panel-card right-column">
                <div class="panel-title">Ресурсы королевства</div>
                <div class="resource-list">
                    <div class="resource-pill"><span>🪙</span><strong id="gold">100</strong></div>
                    <div class="resource-pill"><span>⚔️</span><strong id="army">50</strong></div>
                    <div class="resource-pill"><span>🌾</span><strong id="food">80</strong></div>
                    <div class="resource-pill"><span>📅</span><strong id="day">1</strong></div>
                </div>

                <div class="leaderboard">
                    <h3>Зал Славы</h3>
                    <ol id="leaderboard-list">
                        <li>Ариэль — первый шаг</li>
                        <li>Волшебный Путь</li>
                    </ol>
                </div>
            </aside>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
