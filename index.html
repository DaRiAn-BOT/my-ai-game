<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление Королевством</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем библиотеку Supabase -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>
    <div class="game-container">
        <header>
            <h1>Замковые Хроники</h1>
            <div class="stats">
                <span>🪙 Золото: <strong id="gold">100</strong></span>
                <span>⚔️ Армия: <strong id="army">50</strong></span>
                <span>🌾 Еда: <strong id="food">80</strong></span>
                <span>📅 День: <strong id="day">1</strong></span>
            </div>
        </header>

        <main>
            <div id="event-box">
                <p id="event-text">Загрузка первого события...</p>
                <div id="choices-container">
                    <!-- Сюда ИИ будет добавлять кнопки выбора -->
                </div>
            </div>
        </main>

        <footer>
            <div id="leaderboard">
                <h3>Зал Славы (Топ Правителей)</h3>
                <ol id="leaderboard-list">
                    <li>Загрузка рекордов...</li>
                </ol>
            </div>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
