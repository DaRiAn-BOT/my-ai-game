<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Замковые Хроники</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=MedievalSharp&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-menu" style="display: block;">
        <div class="menu-card">
            <p class="menu-tag">Стратегия • Фэнтези • Королевство</p>
            <h1>Замковые Хроники</h1>
            <div class="menu-actions">
                <button id="start-btn" type="button">Начать правление 👑</button>
            </div>
        </div>
    </div>

    <div id="creation-screen" style="display: none;">
        <div class="creation-card">
            <div class="panel-title">Создание правителя</div>
            <div class="creation-panel">
                <div class="creation-row">
                    <span>💪 Сила</span>
                    <strong id="creation-strength">0</strong>
                    <button class="upgrade-btn" data-stat="strength" type="button">+ Прокачать (20 🪙)</button>
                </div>
                <div class="creation-row">
                    <span>🧠 Мудрость</span>
                    <strong id="creation-wisdom">0</strong>
                    <button class="upgrade-btn" data-stat="wisdom" type="button">+ Прокачать (20 🪙)</button>
                </div>
                <div class="creation-row">
                    <span>👑 Харизма</span>
                    <strong id="creation-charisma">0</strong>
                    <button class="upgrade-btn" data-stat="charisma" type="button">+ Прокачать (20 🪙)</button>
                </div>
            </div>

            <div class="creation-footer">
                <div class="creation-gold">🪙 <strong id="creation-gold">100</strong></div>
                <button id="enter-game-btn" type="button">Взойти на престол</button>
            </div>
        </div>
    </div>

    <main id="game-screen" class="game-container" style="display: none;">
        <div class="game-layout">
            <section class="panel-card left-column">
                <div class="panel-title">Профиль правителя</div>
                <div class="hero-header">
                    <div id="hero-avatar" class="hero-avatar">🧙</div>
                    <div class="hero-name">Ариэль</div>
                </div>

                <div class="stats-grid">
                    <div class="stat-row">
                        <span>💪 Сила</span>
                        <strong id="hero-strength">0</strong>
                        <button class="play-upgrade-btn" data-stat="strength" type="button">+</button>
                    </div>
                    <div class="stat-row">
                        <span>🧠 Мудрость</span>
                        <strong id="hero-wisdom">0</strong>
                        <button class="play-upgrade-btn" data-stat="wisdom" type="button">+</button>
                    </div>
                    <div class="stat-row">
                        <span>👑 Харизма</span>
                        <strong id="hero-charisma">0</strong>
                        <button class="play-upgrade-btn" data-stat="charisma" type="button">+</button>
                    </div>
                </div>

                <div class="panel-title inventory-title">Инвентарь</div>
                <div class="inventory-grid">
                    <button class="inventory-slot" data-slot="0" type="button"><span>Слот 1</span><strong id="slot-0">—</strong></button>
                    <button class="inventory-slot" data-slot="1" type="button"><span>Слот 2</span><strong id="slot-1">—</strong></button>
                    <button class="inventory-slot" data-slot="2" type="button"><span>Слот 3</span><strong id="slot-2">—</strong></button>
                </div>
            </section>

            <section class="panel-card center-column">
                <div class="panel-title">Карта регионов</div>
                <div class="region-grid">
                    <button class="zone-button" data-region="castle" type="button"><span>🏰</span><strong>Замок</strong></button>
                    <button class="zone-button" data-region="forest" type="button"><span>🌲</span><strong>Лес</strong></button>
                    <button class="zone-button" data-region="mines" type="button"><span>⛏️</span><strong>Шахты</strong></button>
                </div>

                <div class="quest-card">
                    <p id="quest-text" class="quest-text">Вы вступаете в путь.</p>
                    <div id="choices-container" class="choices-container"></div>
                </div>
            </section>

            <aside class="panel-card right-column">
                <div class="panel-title">Ресурсы королевства</div>
                <div class="resource-list">
                    <div class="resource-pill"><span>🪙</span><strong id="gold">100</strong></div>
                    <div class="resource-pill"><span>⚔️</span><strong id="army">50</strong></div>
                    <div class="resource-pill"><span>🌾</span><strong id="food">80</strong></div>
                    <div class="resource-pill"><span>📅</span><strong id="day">1</strong></div>
                </div>

                <div class="leaderboard">
                    <h3>Зал Славы</h3>
                    <ol id="leaderboard-list">
                        <li>Ариэль — первый шаг</li>
                    </ol>
                </div>
            </aside>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
